# Ruff config for the sandbox tree (the plan's ship gate is `ruff check`/`ruff format` on
# sandbox/ Python). Mirrors backend's rule set + line-length.
#
# A standalone `ruff.toml` rather than a `[tool.ruff]` table in `pyproject.toml`, for the reason
# spelled out in `pytest.ini`: a `[project]`-less pyproject.toml makes uv treat this directory as
# a virtual workspace root. Ruff documents the two forms as functionally equivalent with an
# identical schema — `ruff.toml` simply drops the `tool.ruff` prefix, so `[tool.ruff.lint]`
# becomes `[lint]`.
#
# py313 because the image now ships Python 3.13 (the Debian 13 base's python3, up from 3.11 on
# bookworm). This target governs `test_app.py` AND `supervisor/app.py`, which run under the
# backend's 3.14 env, a superset. Verified zero delta when moving py311 -> py313: `ruff check`
# and `ruff format --check` are clean on both.
target-version = "py313"
line-length = 99

# There is deliberately no `extend-exclude` for `supervisor/app.py`: it is linted like everything
# else here. It had grown to ~1150 lines against the original spike's 228, and it is the one file
# on the shipped image ruff had never linted. The fix was DELIBERATELY CAPPED to `ruff format`
# plus non-behavioural lint fixes (imports, unused names, style) — any change to control flow,
# exception handling, or a subprocess invocation was left alone for its own follow-up with its own
# review, because this file spawns the dev server and builds the fail-closed child environment and
# no CI covers a bad autofix here before it ships. `supervisor/test_app.py` staying green after the
# format pass is what proves the changes made were the non-behavioural kind they claimed to be.

[lint]
select = ["E", "F", "I", "N", "W", "UP"]
